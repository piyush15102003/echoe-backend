name: Keep Render alive

on:
  schedule:
    # Every 10 minutes — well within Render's 15-min inactivity spin-down
    # GitHub Actions scheduling can delay by a few minutes, so 10 is the safe floor
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allow manual trigger from GitHub Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "https://echoe-backend.onrender.com/health")
          echo "Health check status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "Warning: backend returned $STATUS"
            exit 1
          fi
          echo "Backend is alive"
