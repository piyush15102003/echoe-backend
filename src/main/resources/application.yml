spring:
  application:
    name: echoe-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: UTC

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 15MB

server:
  port: 8080

# --- App-specific config ---

echoe:
  deepseek:
    api-key: ${DEEPSEEK_API_KEY}
    model: deepseek-chat
    base-url: https://api.deepseek.com
    temperature: 0.7
    top-p: 0.95
    max-output-tokens: 400

  sarvam:
    api-key: ${SARVAM_API_KEY}
    base-url: https://api.sarvam.ai
    stt-model: saaras:v3
    tts-model: bulbul:v3

  rate-limit:
    requests-per-minute: 60
    free-sessions-per-week: 5
    messages-per-session: 50
    auth-requests-per-minute: 10

  jwt:
    secret: ${JWT_SECRET}
    access-expiration-ms: ${JWT_EXPIRATION_MS:3600000}
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:7776000000}
